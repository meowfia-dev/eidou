[package]
name = "eidou"
version = "0.1.2"
description = "The Eidou Headless Daemon"
authors = ["TeNNoSuKe", "Souta"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rmcp = { version = "0.14.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.20.0", features = ["v4"] }
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
dashmap = "6.1.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
clap = { version = "4.5.28", features = ["derive", "env"] }
json5 = "1.3.0"
directories = "6.0.0"
rand = "0.9"
base64 = "0.22"
libc = "0.2"
