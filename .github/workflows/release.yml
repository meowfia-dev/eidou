# Eidou Release -- Cross-Platform Build & Publish
# Triggered by pushing a version tag (e.g., v0.1.0).
# Builds for Linux, macOS (ARM64 + Intel), and Windows.
# Uploads artifacts to a GitHub Release (draft).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build (${{ matrix.label }})
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            platform: ubuntu-22.04
            rust-targets: ""
            args: ""

          - label: macos-aarch64
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target aarch64-apple-darwin

          - label: macos-x86_64
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target x86_64-apple-darwin

          - label: windows-x86_64
            platform: windows-latest
            rust-targets: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -- Toolchain Setup --

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-release-${{ matrix.label }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ matrix.label }}-

      # -- System Dependencies (Linux only) --

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      # -- Build & Publish --

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # -- macOS Signing (uncomment when secrets are configured) --
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # -- Windows Signing (uncomment when secrets are configured) --
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Eidou ${{ github.ref_name }}"
          releaseBody: |
            ## Eidou ${{ github.ref_name }}

            **Installers** (recommended for GUI/Daemon usage):
            `.dmg` (macOS) | `.exe`/`.msi` (Windows) | `.deb`/`.rpm` (Linux) | `.AppImage` (Linux portable)

            **Portable binaries** (recommended for MCP Client integration):
            `.tar.gz` (Linux/macOS) | `.zip` (Windows)

            > **Note:** These builds are currently unsigned.
            > You may see security warnings on macOS and Windows.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # -- Portable Binary Packaging --
      # Packages raw binaries for MCP Client configs (curl | sh installer).
      # Linux/macOS: tar.gz with single binary.
      # Windows: zip with single exe.

      - name: Package portable binary (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          cp src-tauri/target/release/eidou eidou
          tar czf "eidou-linux-x86_64.tar.gz" eidou
          rm eidou

      - name: Package portable binary (macOS aarch64)
        if: matrix.label == 'macos-aarch64'
        run: |
          cp src-tauri/target/aarch64-apple-darwin/release/eidou eidou
          tar czf "eidou-macos-aarch64.tar.gz" eidou
          rm eidou

      - name: Package portable binary (macOS x86_64)
        if: matrix.label == 'macos-x86_64'
        run: |
          cp src-tauri/target/x86_64-apple-darwin/release/eidou eidou
          tar czf "eidou-macos-x86_64.tar.gz" eidou
          rm eidou

      - name: Package portable binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "src-tauri\target\release\eidou.exe" "eidou.exe"
          Compress-Archive -Path "eidou.exe" -DestinationPath "eidou-windows-x86_64.zip"
          Remove-Item "eidou.exe"

      - name: Upload portable binary to Release (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: eidou-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable binary to Release (macOS aarch64)
        if: matrix.label == 'macos-aarch64'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: eidou-macos-aarch64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable binary to Release (macOS x86_64)
        if: matrix.label == 'macos-x86_64'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: eidou-macos-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable binary to Release (Windows)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: eidou-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
