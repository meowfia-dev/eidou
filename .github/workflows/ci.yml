# Eidou CI -- Quality Gate
# Runs on every PR and push to main.
# Single Linux runner for fast feedback; full platform builds are in release.yml.

name: CI

on:
  push:
    branches: [0x0]
  pull_request:
    branches: [0x0]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -- Toolchain Setup --

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-

      # -- System Dependencies (Tauri v2 on Linux) --

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      # -- Frontend --

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type-check (app)
        run: bun run check:types

      - name: TypeScript type-check (tests)
        run: bun run check:tests-types

      - name: Check frontend protocol usage
        run: bun run check:frontend-protocol

      - name: Check examples
        run: bun run check:examples

      # -- Backend --

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
